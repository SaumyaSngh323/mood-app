<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus Timer – My Hub</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .timer-display { text-align: center; padding: 36px 20px; }
    .timer-ring { font-size: 5rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; }
    .timer-label { font-size: 0.85rem; opacity: 0.6; margin-bottom: 28px; }
    .timer-controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .timer-controls .btn { max-width: 160px; }
    .preset-row { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
    .preset-btn {
      padding: 8px 18px; border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.07);
      color: inherit; font-family: 'Poppins', sans-serif;
      font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    .preset-btn:hover, .preset-btn.active { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
    .sessions-box { display: flex; gap: 24px; justify-content: center; margin-top: 18px; }
    .session-stat { text-align: center; }
    .stat-num { font-size: 1.6rem; font-weight: 700; }
    .stat-label { font-size: 0.7rem; opacity: 0.55; }
    .custom-time { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .custom-time input { width: 80px; text-align: center; font-size: 1.1rem; font-weight: 600; }
    .custom-time label { font-size: 0.85rem; opacity: 0.65; }
  </style>
</head>
<body class="cute-mode">
  <canvas id="bgCanvas"></canvas>

  <nav class="top-nav">
    <a href="index.html" class="nav-logo">✨ My Hub</a>
    <ul class="nav-links">
      <li><a href="diary.html">Diary</a></li>
      <li><a href="timer.html" class="active">Timer</a></li>
      <li><a href="music.html">Music</a></li>
      <li><a href="goals.html">Goals</a></li>
      <li><a href="wellness.html">Wellness</a></li>
      <li><a href="game.html">Game</a></li>
    </ul>
    <div class="theme-btns">
      <button class="theme-btn" onclick="setTheme('cute')">Cute</button>
      <button class="theme-btn" onclick="setTheme('classy')">Classy</button>
      <button class="theme-btn" onclick="setTheme('dark')">Dark</button>
    </div>
  </nav>

  <div class="page-wrapper">
    <div class="glass-card">
      <h1>🎯 Focus Timer</h1>
      <p class="subtitle">Deep work sessions to keep you in the zone.</p>

      <div class="widget-box">
        <div class="preset-row">
          <button class="preset-btn active" onclick="setPreset(25, this)">25 min</button>
          <button class="preset-btn" onclick="setPreset(45, this)">45 min</button>
          <button class="preset-btn" onclick="setPreset(60, this)">1 hour</button>
          <button class="preset-btn" onclick="setPreset(5, this)">5 min break</button>
        </div>

        <div class="custom-time">
          <input type="number" id="customMins" value="25" min="1" max="180" oninput="onCustomInput()">
          <label>mins</label>
        </div>

        <div class="timer-display">
          <div class="timer-ring" id="timerDisplay">25:00</div>
          <div class="timer-label" id="timerLabel">Ready to focus</div>
          <div class="timer-controls">
            <button class="btn" id="startBtn" onclick="toggleTimer()">▶ Start</button>
            <button class="btn btn-danger" onclick="resetTimer()">↺ Reset</button>
          </div>
        </div>

        <div class="sessions-box">
          <div class="session-stat">
            <div class="stat-num" id="sessionsCount">0</div>
            <div class="stat-label">Sessions done</div>
          </div>
          <div class="session-stat">
            <div class="stat-num" id="totalMins">0</div>
            <div class="stat-label">Minutes focused</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="bg.js"></script>
  <script>
    let countdown = null, totalSeconds = 25*60, remaining = totalSeconds, running = false;
    let sessionsCount = parseInt(localStorage.getItem('timerSessions')||'0');
    let totalMins = parseInt(localStorage.getItem('timerMins')||'0');

    function updateStats() {
      document.getElementById('sessionsCount').innerText = sessionsCount;
      document.getElementById('totalMins').innerText = totalMins;
    }

    function formatTime(s) {
      return `${Math.floor(s/60)}:${s%60<10?'0':''}${s%60}`;
    }

    function setPreset(mins, btn) {
      if (running) return;
      document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('customMins').value = mins;
      totalSeconds = mins*60; remaining = totalSeconds;
      document.getElementById('timerDisplay').innerText = formatTime(remaining);
      document.getElementById('timerLabel').innerText = 'Ready to focus';
    }

    function onCustomInput() {
      if (running) return;
      const val = parseInt(document.getElementById('customMins').value);
      if (isNaN(val)||val<1) return;
      document.querySelectorAll('.preset-btn').forEach(b=>b.classList.remove('active'));
      totalSeconds = val*60; remaining = totalSeconds;
      document.getElementById('timerDisplay').innerText = formatTime(remaining);
    }

    function toggleTimer() {
      if (running) {
        clearInterval(countdown); running = false;
        document.getElementById('startBtn').innerText = '▶ Resume';
        document.getElementById('timerLabel').innerText = 'Paused';
      } else {
        running = true;
        document.getElementById('startBtn').innerText = '⏸ Pause';
        document.getElementById('timerLabel').innerText = 'Focusing…';
        countdown = setInterval(() => {
          remaining--;
          document.getElementById('timerDisplay').innerText = formatTime(remaining);
          if (remaining <= 0) {
            clearInterval(countdown); running = false;
            document.getElementById('timerLabel').innerText = '✅ Session complete!';
            document.getElementById('startBtn').innerText = '▶ Start';
            sessionsCount++; totalMins += Math.round(totalSeconds/60);
            localStorage.setItem('timerSessions', sessionsCount);
            localStorage.setItem('timerMins', totalMins);
            updateStats();
            remaining = totalSeconds;
            setTimeout(()=>document.getElementById('timerDisplay').innerText = formatTime(remaining), 50);
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(countdown); running = false; remaining = totalSeconds;
      document.getElementById('timerDisplay').innerText = formatTime(remaining);
      document.getElementById('startBtn').innerText = '▶ Start';
      document.getElementById('timerLabel').innerText = 'Ready to focus';
    }

    updateStats();
  </script>
</body>
</html>
